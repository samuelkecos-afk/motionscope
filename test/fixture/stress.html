<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MotionScope stress page</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; padding: 8px; }
  .dot { height: 24px; border-radius: 4px; background: #ddd; transition: transform 150ms ease, background-color 150ms ease; }
  .dot.on { transform: scale(0.8); background: #e0245e; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 2s linear infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    // Busy, animation-heavy page: 600 elements, 400 infinite CSS animations,
    // and 300 class toggles per second that each start CSS transitions.
    const grid = document.getElementById('grid');
    for (let i = 0; i < 600; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i % 3 === 0 ? ' spin' : i % 3 === 1 ? ' pulse' : '');
      grid.appendChild(d);
    }
    const dots = grid.children;
    setInterval(() => {
      for (let k = 0; k < 30; k++) dots[(Math.random() * dots.length) | 0].classList.toggle('on');
    }, 100);
  </script>
</body>
</html>
